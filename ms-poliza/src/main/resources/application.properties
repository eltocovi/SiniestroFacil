spring.application.name=ms-poliza
server.port=8084

# Base de datos MySQL (se puede sobreescribir con variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/db_poliza?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger UI: http://localhost:8084/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
jwt.secret=una-clave-secreta-super-larga-para-siniestrofacil-jeje
