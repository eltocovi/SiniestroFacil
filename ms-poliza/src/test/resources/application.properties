spring.application.name=ms-poliza

# Los tests usan H2 en memoria para no depender de un servidor MySQL
spring.datasource.url=jdbc:h2:mem:db_poliza;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
